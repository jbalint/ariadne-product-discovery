name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Generated ports are in sync
        run: |
          node scripts/sync-claude-commands.mjs
          git add -N claude/ skills/
          git diff --exit-code -- claude/ skills/

      - name: Shell syntax
        run: |
          sh -n install.sh
          sh -n claude/hooks/guard-writes.sh

      - name: Plugin manifests are valid JSON
        run: |
          for f in .claude-plugin/marketplace.json claude/.claude-plugin/plugin.json claude/hooks/hooks.json; do
            node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$f" && echo "ok   $f"
          done

      - name: Write guard
        run: sh scripts/test-guard.sh

      - name: JavaScript syntax
        run: |
          node --check logo/generate.mjs
          node --check scripts/sync-claude-commands.mjs
          node --check scripts/check-frontmatter.mjs

      - name: Agent frontmatter and version
        run: node scripts/check-frontmatter.mjs

      - name: Installer dry run
        run: |
          TMP_HOME="$(mktemp -d)"
          env -u XDG_CONFIG_HOME HOME="$TMP_HOME" sh install.sh --all --dry-run

name: Discovery transcript
description: Share a real session where Ariadne changed your understanding of your own product.
title: "[transcript] "
labels: ["transcript"]
body:
  - type: markdown
    attributes:
      value: |
        Real sessions are the best evidence that the method works, and candidates for
        `docs/examples.md`. Remove anything sensitive before posting.
  - type: input
    id: product
    attributes:
      label: Product
      description: One line on what was being designed.
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Agents used
      multiple: true
      options:
        - ariadne-discover
        - ariadne-audit
        - ariadne-architect
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Tool and model
      placeholder: e.g. Claude Code, claude-opus-5-5
  - type: textarea
    id: prompt
    attributes:
      label: Opening prompt
      render: text
    validations:
      required: true
  - type: textarea
    id: shift
    attributes:
      label: What changed
      description: What did you believe before the session, and what do you believe now? Did a "requirement" turn out to be an implementation artifact?
    validations:
      required: true
  - type: textarea
    id: transcript
    attributes:
      label: Transcript
      render: markdown
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: Permission
      options:
        - label: This may be added to docs/examples.md under the MIT license.

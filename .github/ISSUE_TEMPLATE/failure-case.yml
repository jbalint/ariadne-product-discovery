name: Failure case
description: Ariadne converged too early, invented a requirement, or broke another hygiene rule.
title: "[failure] "
labels: ["failure-case"]
body:
  - type: markdown
    attributes:
      value: |
        Failure cases are the most useful bug reports Ariadne gets, and they become
        the eval set. Remove anything sensitive before posting.
  - type: dropdown
    id: agent
    attributes:
      label: Agent
      options:
        - ariadne-discover
        - ariadne-audit
        - ariadne-architect
    validations:
      required: true
  - type: dropdown
    id: tool
    attributes:
      label: Tool
      options:
        - Claude Code (plugin)
        - Claude Code (installed commands)
        - OpenCode
        - Other (pasted prompt)
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model
      placeholder: e.g. claude-opus-5-5
  - type: checkboxes
    id: rule
    attributes:
      label: Which rule broke?
      options:
        - label: Converged too early (declared the workflow done before I recognized it)
        - label: Inference stated as fact (an Inferred/Uncertain claim presented as settled)
        - label: Accepted an implementation artifact as a requirement
        - label: Resolved a contradiction instead of surfacing it
        - label: Asked low-value or too many questions
        - label: Wrote code, a patch, or an engineering plan during discovery
        - label: Wrote outside its own .ariadne/ file
        - label: Other (describe below)
  - type: textarea
    id: prompt
    attributes:
      label: Opening prompt
      description: What you asked Ariadne, verbatim.
      render: text
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where it went wrong
      description: Quote the turn where it went off course and say what it should have done instead.
    validations:
      required: true
  - type: textarea
    id: transcript
    attributes:
      label: Transcript or artifact (optional)
      description: The full session or the resulting .ariadne/*.md file.
      render: markdown
